name: Render notebook snapshots

# Re-runs every notebook in theory/code/ on a fresh Linux box, converts each
# to markdown (with plot images), and commits the result to
# theory/code/snapshots/ so they render on github.com mobile.
#
# The job ignores commits that only touch theory/code/snapshots/, so the
# auto-commit at the end doesn't loop.

on:
  push:
    branches: [main]
    paths:
      - 'theory/code/0?-*.ipynb'
      - 'theory/code/render-snapshots.py'
      - '.github/workflows/render-snapshots.yml'
  workflow_dispatch:  # manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    # Run JS actions on Node 24 (Node 20 is deprecated; forced June 2 2026).
    # Set per GitHub's deprecation notice — safer than chasing action major
    # versions that may or may not be released yet.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyter nbconvert numpy matplotlib tiktoken
          # PyTorch CPU-only build for notebook 06
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Render notebooks
        working-directory: theory/code
        run: python render-snapshots.py --timeout 900

      - name: Commit snapshots if anything changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add theory/code/snapshots/
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
            exit 0
          fi
          git commit -m "Auto-render notebook snapshots [skip ci]"
          git push
